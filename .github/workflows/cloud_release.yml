name: Cloud Build & Auto-Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v268.03.5)'
        required: true
        default: 'v268.03.5'

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev zip unzip ccache lld

      - name: Setup Android Environment
        run: |
          mkdir -p ~/.android
          touch ~/.android/repositories.cfg

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools
          pip install buildozer cython==0.29.37

      - name: Build APK with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: android-apk
          path: bin/*.apk

  build-pc:
    name: Build PC Nuitka Binary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install UPX & System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y upx patchelf

      - name: Install Dependencies
        run: pip install nuitka PySide6 requests pyjnius

      - name: Compile PC Binary (Portable Onefile)
        run: |
          python3 -m nuitka \
            --standalone \
            --onefile \
            --enable-plugin=pyside6 \
            --enable-plugin=upx \
            --upx-binary=$(which upx) \
            --noinclude-qt-translations \
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner \
            --linux-icon=icon.png \
            --output-filename=ScrcpyHeartbeat-Linux-Portable.bin \
            main.py

      - name: Compile PC Binary (Standalone Folder)
        run: |
          python3 -m nuitka \
            --standalone \
            --enable-plugin=pyside6 \
            --enable-plugin=upx \
            --upx-binary=$(which upx) \
            --noinclude-qt-translations \
            --nofollow-import-to=tkinter,test,unittest,pydoc,doctest,email,html,http,xml,distutils,setuptools,numpy,scipy,matplotlib,curses,PySide6.QtQml,PySide6.QtQuick,PySide6.QtWebEngineCore,PySide6.QtWebEngineWidgets,PySide6.Qt3DCore,PySide6.QtPdf,PySide6.QtSql,PySide6.QtMultimedia,PySide6.QtTest,PySide6.QtSensors,PySide6.QtPositioning,PySide6.QtBluetooth,PySide6.QtDesigner \
            --linux-icon=icon.png \
            --output-dir=standalone_build \
            main.py
          zip -r ScrcpyHeartbeat-Linux-Standalone.zip standalone_build/main.dist/

      - name: Upload PC Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pc-binary
          path: |
            ScrcpyHeartbeat-Linux-Portable.bin
            ScrcpyHeartbeat-Linux-Standalone.zip

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-pc]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          path: ./release-assets

      - name: Display downloaded assets
        run: ls -la -R ./release-assets || true

      - name: Create GitHub Release & Attach Binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name != '' && github.ref_name || github.event.inputs.tag_name }}
          name: Scrcpy Heartbeat ${{ github.ref_name != '' && github.ref_name || github.event.inputs.tag_name }}
          body: |
            ## Automated Cloud Release
            Both the PC binary and Android APK were automatically compiled in the cloud by GitHub Actions!

            ### Download Instructions:
            - **PC (Linux):** Download `ScrcpyHeartbeat-Linux-Portable.bin` (give execute permissions with `chmod +x`), or unzip `ScrcpyHeartbeat-Linux-Standalone.zip` and run `main.bin`!
            - **Android:** Download the `.apk` file and install it on your phone!
          files: |
            ./release-assets/android-apk/*.apk
            ./release-assets/pc-binary/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}