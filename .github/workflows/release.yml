name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v1.0.0

jobs:
  build-pc:
    name: Build Linux PC Binary (Nuitka)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install System Dependencies for PyQt6 & Nuitka
        run: |
          sudo apt-get update
          sudo apt-get install -y patchelf ccache libqt6core5compat6-dev python3-pyqt6

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install nuitka
          pip install -r requirements.txt

      - name: Compile with Nuitka
        run: |
          # Bypassing the wrapper script and running nuitka directly for CI
          python -m nuitka \
            --standalone \
            --onefile \
            --plugin-enable=pyqt6 \
            --assume-yes-for-downloads \
            --output-dir=dist/ \
            --output-filename=ScrcpyUltimateLink \
            main.py

      - name: Upload Linux Binary
        uses: actions/upload-artifact@v4
        with:
          name: PC-Linux-Binary
          path: dist/ScrcpyUltimateLink

  build-android:
    name: Build Android APK (Buildozer)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Buildozer Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade buildozer cython virtualenv

      - name: Build APK with Buildozer
        run: |
          yes | buildozer android release || yes | buildozer android debug
          # Rename the output for clarity
          mv bin/*.apk bin/ScrcpyUltimateLink-Android.apk

      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: bin/ScrcpyUltimateLink-Android.apk

  publish-release:
    name: Create GitHub Release
    needs: [build-pc, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download PC Binary
        uses: actions/download-artifact@v4
        with:
          name: PC-Linux-Binary
          path: artifacts/

      - name: Download Android APK
        uses: actions/download-artifact@v4
        with:
          name: Android-APK
          path: artifacts/

      - name: Generate Release Notes
        run: |
          echo "## ScrcpyUltimateLink Release ${GITHUB_REF_NAME}" > release_notes.md
          echo "Automated release build." >> release_notes.md

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/ScrcpyUltimateLink
            artifacts/ScrcpyUltimateLink-Android.apk
          body_path: release_notes.md
          draft: false
          prerelease: false
